# Optional Fly.io config for boxwren-server.
# fly apps create boxwren-api && fly deploy

app = "boxwren-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.server"

[env]
  BOXWREN_LISTEN = "0.0.0.0:8787"
  BOXWREN_DB = "/data/boxwren.sqlite"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "boxwren_data"
  destination = "/data"
