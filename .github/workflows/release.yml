name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tag:
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          tag=${subject#"release: "}
          tag=${tag%%[[:space:]]*}
          tag=${tag%$'\r'}
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9][0-9A-Za-z._+-]*$'; then
            echo "commit subject must start with release: vX.Y.Z (got: ${tag})"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  demo:
    needs: release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Demo
        run: |
          cargo build -p boxwren-cli --release
          ./target/release/boxwren demo --report json > demo.json
          cat demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo.json

  binaries:
    needs: [release-tag, demo]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: boxwren-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: boxwren-x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: boxwren-aarch64-apple-darwin
          # Build Intel mac on macos-latest (cross target). macos-13 runners often sit queued forever.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: boxwren-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: boxwren-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2,${{ matrix.target }}
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p boxwren-cli --release --target ${{ matrix.target }}
      - name: Build FFI library for Go
        run: cargo build -p boxwren-ffi --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/boxwren${ext}" "dist/${{ matrix.artifact }}"
          lib="target/${{ matrix.target }}/release/"
          # musl drops cdylib; ship staticlib (.a). Other targets ship the shared lib.
          case "${{ matrix.target }}" in
            *apple-darwin)
              cp "${lib}libboxwren_ffi.dylib" "dist/libboxwren_ffi-${{ matrix.target }}.dylib"
              ;;
            *windows*)
              cp "${lib}boxwren_ffi.dll" "dist/libboxwren_ffi-${{ matrix.target }}.dll"
              ;;
            *musl*)
              cp "${lib}libboxwren_ffi.a" "dist/libboxwren_ffi-${{ matrix.target }}.a"
              ;;
            *)
              cp "${lib}libboxwren_ffi.so" "dist/libboxwren_ffi-${{ matrix.target }}.so"
              ;;
          esac
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  github_release:
    needs: [release-tag, demo, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release commit
        run: git tag -f "${{ needs.release-tag.outputs.tag }}"
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: boxwren-*
          merge-multiple: true
      - name: Download demo report
        uses: actions/download-artifact@v4
        with:
          name: demo-report
          path: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true

  publish:
    needs: [release-tag, github_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish the library
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN unset; skipping crates.io publish"
            exit 0
          fi
          cargo publish -p boxwren --token "$CARGO_REGISTRY_TOKEN"
