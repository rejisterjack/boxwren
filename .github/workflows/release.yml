name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Demo
        run: |
          cargo build -p boxwren-cli --release
          ./target/release/boxwren demo --report json > demo.json
          cat demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo.json

  binaries:
    needs: demo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: boxwren-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: boxwren-x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: boxwren-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: boxwren-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: boxwren-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2,${{ matrix.target }}
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p boxwren-cli --release --target ${{ matrix.target }}
      - name: Build FFI library for Go
        run: cargo build -p boxwren-ffi --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/boxwren${ext}" "dist/${{ matrix.artifact }}"
          lib="target/${{ matrix.target }}/release/"
          # cdylib output: .dylib / .dll / .so (including musl). Also keep .rlib/.a if present.
          case "${{ matrix.target }}" in
            *apple-darwin)
              cp "${lib}libboxwren_ffi.dylib" "dist/libboxwren_ffi-${{ matrix.target }}.dylib"
              ;;
            *windows*)
              cp "${lib}boxwren_ffi.dll" "dist/libboxwren_ffi-${{ matrix.target }}.dll"
              ;;
            *)
              cp "${lib}libboxwren_ffi.so" "dist/libboxwren_ffi-${{ matrix.target }}.so"
              ;;
          esac
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  github_release:
    needs: [demo, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: boxwren-*
          merge-multiple: true
      - name: Download demo report
        uses: actions/download-artifact@v4
        with:
          name: demo-report
          path: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    needs: [github_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish the library
        run: cargo publish -p boxwren --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
