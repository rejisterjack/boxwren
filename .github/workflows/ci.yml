name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1,wasm32-wasip2
      - name: Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # Skip CLI default interpreters feature so unit tests stay fast and
        # do not compile MicroPython/QuickJS in parallel with timing tests.
        run: cargo test --workspace --no-default-features
      - name: Interpreters feature
        run: cargo test -p boxwren --features interpreters --lib -- --test-threads=2
      - name: Short fuzz
        run: cargo test -p boxwren --test fuzz_smoke --release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
