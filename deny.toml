[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-wasip1" },
]

[advisories]
yanked = "warn"
unmaintained = "workspace"
# Transitive via wasmtime-internal-cache → zstd. Wasmtime 50.0.1 still
# pins zstd-safe 7.3.0. Boxwren does not expose a user-facing zstd write
# decoder; ignore until Wasmtime bumps the dep.
ignore = [
    { id = "RUSTSEC-2026-0403", reason = "transitive via wasmtime cache; no upgrade path on wasmtime 50" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
