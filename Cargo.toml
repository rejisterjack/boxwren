[workspace]
resolver = "2"
members = [
    "crates/boxwren",
    "crates/boxwren-cli",
    "crates/boxwren-py",
    "crates/boxwren-ffi",
    "crates/boxwren-server",
]
exclude = ["tests/guests", "tests/guests-p2", "guests/interpreters"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rejisterjack/boxwren"
rust-version = "1.97"
authors = ["Boxwren contributors"]

[workspace.dependencies]
# Drop `cache` (and its zstd) so cargo-deny stays clean; Boxwren does not use
# Wasmtime's on-disk module cache.
wasmtime = { version = "50", default-features = false, features = [
    "cranelift",
    "runtime",
    "component-model",
    "wat",
    "std",
    "parallel-compilation",
    "pooling-allocator",
    "threads",
    # Needed so `wasm_exceptions` can load MicroPython WASI guests.
    "gc",
    "gc-null",
] }
wasmtime-wasi = "50"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
pyo3 = { version = "0.30", features = ["auto-initialize"] }
