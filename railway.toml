# Hosted API. One replica: SQLite and in-memory kill handles live in this process.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.server"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Free plan refuses sleepApplication = false. A paid workspace can turn this off.
sleepApplication = true
overlapSeconds = 0
drainingSeconds = 15
