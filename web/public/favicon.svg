<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b130e"/>
      <stop offset="50%" stop-color="#060907"/>
      <stop offset="100%" stop-color="#030504"/>
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Top Isometric Face -->
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Left Isometric Face -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Right Isometric Face -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#0d5d36"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1f3b29" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="116" ry="116" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" ry="116" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Ambient Phosphor Nebula -->
  <circle cx="256" cy="256" r="140" fill="#4ade80" opacity="0.12" filter="blur(40px)"/>

  <!-- Isometric Containment Enclave (Box + Wren Geometric Glyph) -->
  <g filter="url(#dropShadow)" transform="translate(0, -6)">
    <!-- Outer Containment Hexagon Shell -->
    <!-- Top Face -->
    <polygon points="256,104 380,176 256,248 132,176" fill="url(#topFaceGrad)"/>

    <!-- Left Face -->
    <polygon points="132,176 256,248 256,392 132,320" fill="url(#leftFaceGrad)"/>

    <!-- Right Face -->
    <polygon points="256,248 380,176 380,320 256,392" fill="url(#rightFaceGrad)"/>

    <!-- Internal Cutout Enclave / Sandboxed Guest Chamber -->
    <g transform="translate(256, 252) scale(0.68) translate(-256, -248)">
      <!-- Inner Dark Chamber Top -->
      <polygon points="256,128 360,188 256,248 152,188" fill="#040705" opacity="0.92"/>
      <!-- Inner Chamber Left -->
      <polygon points="152,188 256,248 256,368 152,308" fill="#020403" opacity="0.95"/>
      <!-- Inner Chamber Right -->
      <polygon points="256,248 360,188 360,308 256,368" fill="#030604" opacity="0.94"/>

      <!-- Sandboxed Core (Wren Bird Prism / Energetic Wasm Kernel) -->
      <!-- Center Glowing Kernel Cube -->
      <g filter="url(#emeraldGlow)">
        <!-- Floating Diamond Core -->
        <polygon points="256,192 308,222 256,252 204,222" fill="url(#coreGrad)"/>
        <polygon points="204,222 256,252 256,312 204,282" fill="#10b981"/>
        <polygon points="256,252 308,222 308,282 256,312" fill="#34d399"/>
      </g>

      <!-- Precision Security Beam Lines / Coordinates -->
      <line x1="256" y1="128" x2="256" y2="192" stroke="#4ade80" stroke-width="3" stroke-dasharray="4,4" opacity="0.8"/>
      <line x1="152" y1="308" x2="204" y2="282" stroke="#4ade80" stroke-width="3" stroke-dasharray="4,4" opacity="0.8"/>
      <line x1="360" y1="308" x2="308" y2="282" stroke="#4ade80" stroke-width="3" stroke-dasharray="4,4" opacity="0.8"/>
    </g>

    <!-- Stylized Agile Wren Beak / Apex Indicator -->
    <polygon points="256,76 270,104 242,104" fill="#a7f3d0" filter="url(#emeraldGlow)"/>

    <!-- Perimeter Circuit Nodes -->
    <circle cx="256" cy="104" r="5" fill="#ffffff"/>
    <circle cx="380" cy="176" r="4" fill="#6ee7b7"/>
    <circle cx="132" cy="176" r="4" fill="#6ee7b7"/>
    <circle cx="256" cy="392" r="5" fill="#4ade80"/>
  </g>
</svg>
