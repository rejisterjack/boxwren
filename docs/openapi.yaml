openapi: 3.0.3
info:
  title: Boxwren Hosted API
  description: |
    Optional multi-tenant HTTP API around the Boxwren Wasmtime sandbox.
    Local-first embed remains the primary path; see docs/HOSTED.md.
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8787
    description: Local boxwren-server
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /v1/accounts:
    post:
      summary: Create account and initial API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponse"
        "429":
          description: Rate limit exceeded
  /v1/me:
    get:
      summary: Current account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Missing or invalid API key
  /v1/keys:
    get:
      summary: List API key metadata
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
    post:
      summary: Create API key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Key created (secret shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
  /v1/runs:
    get:
      summary: List recent runs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunSummary"
    post:
      summary: Start a sandbox run
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "200":
          description: |
            When `wait` is true (default), includes the finished report.
            When `wait` is false, `status` is `running` and `report` is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
  /v1/runs/{id}:
    get:
      summary: Fetch one run and its report JSON
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRunResponse"
        "404":
          description: Unknown run
  /v1/runs/{id}/kill:
    post:
      summary: Fire the kill switch for an in-flight run
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Kill requested
        "404":
          description: Run not in flight
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from POST /v1/accounts or POST /v1/keys (`bw_…`)
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        created_at:
          type: string
    CreateAccountResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        api_key:
          type: string
    CreateKeyResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        api_key:
          type: string
    RunSummary:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        duration_ms:
          type: integer
        fuel_used:
          type: integer
        created_at:
          type: string
    CreateRunRequest:
      type: object
      properties:
        wasm_base64:
          type: string
          description: Base64-encoded Wasm bytes
        wasm_text:
          type: string
          description: WAT or raw text for demos
        entry:
          type: string
          default: _start
        args:
          type: array
          items:
            type: string
        fuel:
          type: integer
        memory_bytes:
          type: integer
        wall_ms:
          type: integer
        dirs:
          type: array
          items:
            type: string
        net:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            type: string
        wait:
          type: boolean
          default: true
          description: When false, return immediately so kill can target the run
    CreateRunResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        report:
          type: object
          description: Boxwren schema v1 report when wait completed
    GetRunResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        report:
          type: object
